name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: abstractentity
    steps:
      - name: Check out AbstractEntity
        uses: actions/checkout@v4
        with:
          path: abstractentity

      # The Vite build bundles @abstractframework/ui-kit and panel-chat from
      # AbstractUIC sources (see vite.config.ts), so the sibling checkout is
      # required even once every runtime dependency comes from npm.
      - name: Check out AbstractUIC
        uses: actions/checkout@v4
        with:
          repository: lpalbou/AbstractUIC
          path: abstractuic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: abstractentity/package-lock.json

      - name: Refuse local file dependencies
        run: |
          node -e '
            const pkg = require("./package.json");
            const bad = Object.entries(pkg.dependencies || {}).filter(([, v]) => String(v).startsWith("file:"));
            if (bad.length) {
              console.error("Runtime dependencies must come from the registry before publishing:");
              for (const [n, v] of bad) console.error(`  ${n}: ${v}`);
              process.exit(1);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Publish package
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${PKG_VERSION} is already published; skipping."
          else
            npm publish --access public --provenance
          fi

  github-release:
    name: GitHub release
    needs: publish-npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "AbstractEntity ${GITHUB_REF_NAME#v}" --generate-notes
          fi
