name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abstractentity
    steps:
      - name: Check out AbstractEntity
        uses: actions/checkout@v4
        with:
          path: abstractentity

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: abstractentity/package-lock.json

      # The lockfile guard (scripts/check_lock.mjs, no dependency needed): fails when
      # package-lock.json lags package.json or resolves an @abstractframework/*
      # package below its floor, in another major.minor, or from a local tarball.
      - name: Check the lockfile
        run: npm run check:lock

      - name: Install dependencies
        run: npm ci

      - name: Check app-server resolves
        run: node -e "import('@abstractframework/app-server').then(m => { for (const n of ['createGatewaySessionProxy', 'createMountedHandler', 'injectShell', 'parseAppFlagsOrExit', 'createGatewayUrlResolver']) if (typeof m[n] !== 'function') throw new Error(n + ' missing (app-server too old for the /apps/<id>/ mount)'); console.log('app-server OK'); })"

      # Build first: mount_server.test.ts starts the real CLI, which serves dist/index.html.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: CLI smoke test
        run: node bin/cli.js --help

      - name: Validate npm package contents
        run: npm pack --dry-run
